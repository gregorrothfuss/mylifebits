<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel 8 VM — Google Maps Timeline</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Top Control Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      padding: 10px 16px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .date-jump-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .date-jump-box input {
      background: transparent;
      border: none;
      color: #f8fafc;
      font-size: 12px;
      font-family: inherit;
      width: 95px;
      outline: none;
    }
    .date-jump-box button {
      background: #3b82f6;
      border: none;
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .date-jump-box button:hover {
      background: #2563eb;
    }

    /* Phone Device Chassis */
    .phone-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #181d28;
      padding: 12px;
      border-radius: 46px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 2px #2d3748, inset 0 0 0 2px #0f172a;
      max-height: calc(100vh - 60px);
      width: fit-content;
    }
    .phone-screen-container {
      position: relative;
      height: min(800px, calc(100vh - 165px));
      aspect-ratio: 9 / 20;
      width: auto;
      max-width: calc(100vw - 60px);
      background: #000;
      border-radius: 36px;
      overflow: hidden;
      cursor: crosshair;
      box-shadow: inset 0 0 4px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .camera-punch {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      background: #000;
      border: 2px solid #1a202c;
      border-radius: 50%;
      z-index: 10;
      pointer-events: none;
    }
    #phone-canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      touch-action: none;
    }

    /* Android System Navigation Bar */
    .phone-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      width: 100%;
      padding-top: 10px;
      padding-bottom: 2px;
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      width: 50px;
      height: 36px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .nav-btn:hover {
      background: #273142;
      color: #f8fafc;
    }
    .nav-btn:active {
      transform: scale(0.9);
      background: #3b82f6;
      color: #fff;
    }

    /* Status Badge */
    .spinner-overlay {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 20;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Minimal Top Bar -->
  <div class="top-bar">
    <div class="status-indicator">
      <span class="pulse-dot"></span>
      <span id="device-label">Pixel 8 VM (Online)</span>
    </div>
    <div class="date-jump-box">
      <button id="btn-open-timeline" style="background:#059669; color:#fff; border:none; padding:4px 10px; border-radius:6px; font-size:11px; font-weight:700; cursor:pointer;" title="Open Google Maps Timeline"><i class="fa-solid fa-clock-rotate-left"></i> Timeline</button>
      <input type="date" id="jump-date-input" value="2024-05-18">
      <button id="btn-jump-date"><i class="fa-solid fa-bolt"></i> Jump</button>
      <button id="btn-restart-maps" title="Restart Google Maps" style="background:#475569;"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
  </div>

  <!-- Centered Mobile Device -->
  <div class="phone-wrapper">
    <div class="phone-screen-container" id="screen-container">
      <div class="camera-punch"></div>
      <canvas id="phone-canvas" width="540" height="1200"></canvas>
    </div>

    <!-- Android Hardware Navigation Keys -->
    <div class="phone-nav-bar">
      <button class="nav-btn" id="nav-back" title="Back (Key 4)"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="nav-btn" id="nav-home" title="Home (Key 3)"><i class="fa-regular fa-circle"></i></button>
      <button class="nav-btn" id="nav-recents" title="Recents (Key 187)"><i class="fa-regular fa-square"></i></button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("phone-canvas");
    const ctx = canvas.getContext("2d");

    let isStreaming = true;

    // High-speed low-latency stream loop via Canvas
    function loadNextFrame() {
      if (!isStreaming) return;
      const nextImg = new Image();
      nextImg.onload = () => {
        if (nextImg.naturalWidth && nextImg.naturalHeight) {
          if (canvas.width !== nextImg.naturalWidth || canvas.height !== nextImg.naturalHeight) {
            canvas.width = nextImg.naturalWidth;
            canvas.height = nextImg.naturalHeight;
            const container = document.getElementById("screen-container");
            if (container) {
              container.style.aspectRatio = `${nextImg.naturalWidth} / ${nextImg.naturalHeight}`;
            }
          }
        }
        ctx.drawImage(nextImg, 0, 0, canvas.width, canvas.height);
        setTimeout(loadNextFrame, 35);
      };
      nextImg.onerror = () => {
        setTimeout(loadNextFrame, 200);
      };
      nextImg.src = `/api/device/screen?t=${Date.now()}`;
    }
    loadNextFrame();

    // Coordinate conversion
    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
      const clientY = e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
      const x = Math.round((clientX - rect.left) * (canvas.width / rect.width));
      const y = Math.round((clientY - rect.top) * (canvas.height / rect.height));
      return {
        x: Math.max(0, Math.min(canvas.width, x)),
        y: Math.max(0, Math.min(canvas.height, y))
      };
    }

    async function sendTouch(action, x, y, x2 = null, y2 = null, duration = 200) {
      try {
        await fetch("/api/device/touch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, x, y, x2, y2, duration_ms: duration })
        });
        setTimeout(loadNextFrame, 50);
      } catch (err) {
        console.error("Touch error:", err);
      }
    }

    // Mouse events
    let isDown = false;
    let startX = 0, startY = 0, startTime = 0;

    canvas.addEventListener("mousedown", (e) => {
      isDown = true;
      const c = getCoords(e);
      startX = c.x;
      startY = c.y;
      startTime = Date.now();
    });

    window.addEventListener("mouseup", async (e) => {
      if (!isDown) return;
      isDown = false;
      const c = getCoords(e);
      const dist = Math.hypot(c.x - startX, c.y - startY);
      const duration = Math.min(600, Math.max(100, Date.now() - startTime));
      if (dist < 15) {
        await sendTouch("tap", startX, startY);
      } else {
        await sendTouch("swipe", startX, startY, c.x, c.y, duration);
      }
    });

    // Touch events for mobile/tablet clients
    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        const c = getCoords(e.touches[0]);
        startX = c.x;
        startY = c.y;
        startTime = Date.now();
        isDown = true;
      }
    }, { passive: false });

    canvas.addEventListener("touchend", async (e) => {
      if (!isDown) return;
      isDown = false;
      if (e.changedTouches.length > 0) {
        const c = getCoords(e.changedTouches[0]);
        const dist = Math.hypot(c.x - startX, c.y - startY);
        const duration = Math.min(600, Math.max(100, Date.now() - startTime));
        if (dist < 15) {
          await sendTouch("tap", startX, startY);
        } else {
          await sendTouch("swipe", startX, startY, c.x, c.y, duration);
        }
      }
    });

    // Physical Keyboard Listener
    window.addEventListener("keydown", async (e) => {
      if (document.activeElement === document.getElementById("jump-date-input")) {
        return;
      }
      if (["Shift", "Control", "Alt", "Meta"].includes(e.key)) return;
      e.preventDefault();

      try {
        await fetch("/api/device/keyboard", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: e.key })
        });
        setTimeout(loadNextFrame, 50);
      } catch (err) {
        console.error("Keyboard error:", err);
      }
    });

    // Navigation Buttons
    document.getElementById("nav-back").addEventListener("click", async () => {
      await sendTouch("key", 4);
    });
    document.getElementById("nav-home").addEventListener("click", async () => {
      await sendTouch("key", 3);
    });
    document.getElementById("nav-recents").addEventListener("click", async () => {
      await sendTouch("key", 187);
    });

    // Direct Timeline Launch
    document.getElementById("btn-open-timeline").addEventListener("click", async () => {
      try {
        await fetch("/api/device/open-timeline", { method: "POST" });
        setTimeout(loadNextFrame, 400);
        setTimeout(loadNextFrame, 1000);
      } catch (e) {
        console.error("Open timeline error:", e);
      }
    });

    // Jump to Date Intent
    async function jumpToDate() {
      const dateVal = document.getElementById("jump-date-input").value;
      if (!dateVal) return;
      try {
        await fetch("/api/device/intent-day", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ date: dateVal })
        });
        setTimeout(loadNextFrame, 300);
        setTimeout(loadNextFrame, 800);
      } catch (e) {
        console.error("Intent error:", e);
      }
    }
    document.getElementById("btn-jump-date").addEventListener("click", jumpToDate);

    // Restart Maps Activity
    document.getElementById("btn-restart-maps").addEventListener("click", async () => {
      await fetch("/api/device/touch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "key", x: 3 })
      });
      setTimeout(jumpToDate, 400);
    });
  </script>
</body>
</html>
