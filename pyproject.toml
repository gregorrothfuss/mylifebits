[project]
name = "mylifebits"
version = "0.1.0"
description = "A privacy-first personal location timeline viewer, Takeout ingestion engine, and life archive."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "MyLifeBits Contributors" }
]
dependencies = [
    "cramjam>=2.11.0",
    "pillow>=11.3.0",
    "playwright>=1.60.0",
    "s2sphere>=0.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "enrichment*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
